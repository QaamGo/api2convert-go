name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: # enables the manual live-run path the `live` job gates on

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # Keep the live-tagged code compilable even though it only runs in the live
      # job (behind a key). vet exercises the `live` build tag without hitting the API.
      - name: go vet (live build tag)
        run: go vet -tags live ./...
      - name: Zero-dependency guarantee (go.mod stays require-free)
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum changed — the SDK must stay dependency-free"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22 is the go.mod minimum (pin it for back-compat); oldstable/stable
        # track the two currently-supported releases so the matrix never goes EOL.
        go: ["1.22", "oldstable", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      # Offline unit + independent security suites are hermetic (no API key).
      - name: Unit + security suites
        run: go test -race ./...
      - name: Security suite (explicit, in isolation)
        run: go test -race ./security/...

  vulncheck:
    # The SDK has zero third-party dependencies, so this is really a toolchain gate: a Go
    # stdlib advisory (crypto/tls, net/http, archive/*) is the only way a vulnerability can
    # reach consumers here. govulncheck reports only what our code actually calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true # newest patch release, so stdlib security fixes are seen
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  live:
    # Live tests hit the real (production) API and consume quota: only on master or
    # a manual dispatch, and only when the key secret is present.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    continue-on-error: true # allow_failure equivalent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      # The production key is scoped to only this step (not job-level env), so the
      # third-party checkout/setup-go actions never see it.
      - name: Live conformance (skips if no key)
        env:
          API2CONVERT_API_KEY: ${{ secrets.API2CONVERT_API_KEY }}
        run: |
          if [ -z "$API2CONVERT_API_KEY" ]; then echo "no key; skipping live tests"; exit 0; fi
          go test -tags live -timeout 300s ./live/...
